<!DOCTYPE html>
<html lang="lv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title id="page-title">
        Tavs rezultāts
    </title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

    <main class="app">

        <section class="screen landing-screen">

            <div class="landing-content">

                <div class="pastry-placeholder result-image-container">
                    <img id="result-image" src="" alt="">
                </div>

                <p class="eyebrow" id="result-eyebrow">
                    ATBILDES - TU ESI KĀ...
                </p>

                <h1 id="result-title">
                    Vecrīga
                </h1>

                <p
                    class="landing-description"
                    id="result-description">
                </p>

                <div class="bakery-link-section">

                    <p class="bakery-link-text" id="bakery-link-text"></p>

                    <a
                        class="bakery-link"
                        id="bakery-link"
                        href=""
                        target="_blank"
                        rel="noopener noreferrer">
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script>

        /*
         * Get language
         */

        const language =
            localStorage.getItem("quizLanguage") || "lv";


        /*
         * Get result
         */

        const result =
            localStorage.getItem("quizResult");


    
        const resultImages = {
            vecriga: "images/vecriga.webp",
            piradzins: "images/piradzins.webp",
            austina: "images/austina.webp",
            biezpienmaize: "images/biezpienmaize.webp"
        };


        /*
         * Result content
         */

        const results = {

            vecriga: {

                lv: {
                    name: "Vecrīga",

                    description:
                        "Jūs esat personība ar vieglu, gaisīgu un draudzīgu raksturu, kam Rīgā šobrīd daudz draugu un būs vēl vairāk. Cilvēks - svētki, kas līdzcilvēkos rada prieku ar savu klātbūtni. Visi, kas Jūs pazīst, var apliecināt, ka Jums piemīt izsmalcināta gaume, bet ne grama snobisma."
                },

                en: {
                    name: "Vecrīga (Cream Puff)",

                    description:
                        "You are a personality with a light, airy, and friendly nature, who currently has many friends in Riga and will soon have even more. A true life of the party, creating joy in those around you simply with your presence. Everyone who knows you can attest that you possess refined taste without a single grain of snobbery."
                }

            },


            piradzins: {

                lv: {
                    name: "Pīrādziņš",

                    description:
                        "Jums piemīt pamatīgs, uzticams un nosvērts raksturs. Jums svarīgas tradīcijas un savas saknes, bet vienlaikus esat gatavs arī jauniem piedzīvojumiem un eksperimentiem. Pirms jauniem darbiem Jums gan kartīgi “jānobriest”, bet tad esat spējīgs gandrīz uz visu. Jums piemīt talants rast domubiedrus gan gaļēdāju, gan veģetāriešu kompānijās."
                },

                en: {
                    name: "Pīrādziņš (Traditional pastry pie)",

                    description:
                        'You possess a solid, reliable, and grounded character. Traditions and your roots are important to you, but at the same time, you are always ready for new adventures and experiments. Before diving into new endeavors, you do need proper time to "rise," but once you do, you are capable of almost anything. You have a knack for finding common ground in both meat-eater and vegetarian crowds alike.'
                }

            },


            austina: {

                lv: {
                    name: "Austiņa",

                    description:
                        "Jums piemīt rotaļīgs, pārsteidzošs un daudžķautņains raksturs, kas draugiem atklājas kārtu pēc kārtas. Jūs radāt sajūtu, ka spējat atrasties vairākās vietās vienlaikus un ar savu klātbūtni piepildīt jebkuru telpu. Daži no draugiem Jūs salīdzina ar sirdi, izceļot Jūsu sirsnīgo dabu, citiem Jūs atgādināt ausi, jo spējat ieklausīties citos."
                },

                en: {
                    name: "Austiņa (Palmier)",

                    description:
                        "You have a playful, surprising, and multifaceted character that unfolds layer by layer to your friends. You give off the feeling that you can be in multiple places at once, filling any room with your energy. Some of your friends compare you to a heart, highlighting your warm nature, while others say you remind them of an ear, as you always know how to truly listen to others."
                }

            },


            biezpienmaize: {

                lv: {
                    name: "Biezpienmaize",

                    description:
                        "Jūs esat cilvēks, kas ikvienā dzīvēs situācijā māk “uzlikt punktiņu uz i” - gan svētkos, gan darba dienās. Jūs apzināties savu vērtību un nemēģināt izlikties par to, kas neesat. Jums viss dzīvē ir veselīgā balansā - Jums piemīt gan biezpiena nosvērtība, gan cukursaldā rakstura puse, gan pilnīgi noteikti - vairāk kā viena rakstura rozīnīte. Jūsu klātbūtne līdzcilvēkos rada miera un komforta sajūtu - visi zina, ka uz Jums var paļauties un Jūsu draudzība ir veselīga dzīves izvēle."
                },

                en: {
                    name: "Biezpienmaize (Curd Cake)",

                    description:
                        `You know how to "dot the i" in any situation - on holidays and workdays alike. You know your worth and never try to pretend to be someone you're not. Everything in your life is in healthy balance - you have the groundedness of cottage cheese, a sweet-as-sugar side, and most definitely more than one "raisin" (spark) in your personality. Your presence brings a sense of peace and comfort to those around you; everyone knows they can rely on you and that your friendship is a wholesome choice in life.`
                }

            }

        };


        /*
         * Text around the result
         */

        const interfaceText = {

            lv: {
                eyebrow: "TU ESI KĀ...",
                pageTitle: "Tavs rezultāts",
                bakeryText: "Rīgas labākās Vecrīgas un citas smalkmaizītes meklējiet",
                bakeryUrl: "https://rigabakeries.lv/"
            },

            en: {
                eyebrow: "YOU ARE LIKE A...",
                pageTitle: "Your result",
                bakeryText: "Find Riga's best Vecrīgas and other delicious pastries at",
                bakeryUrl: "https://rigabakeries.lv/en"
            }

        };


        /*
         * Get the correct result content
         */

        const resultData =
            results[result][language];

        const resultImage =
            document.getElementById("result-image");

        resultImage.src =
            resultImages[result];

        resultImage.alt =
            resultData.name;

        /*
         * Update page
         */

        document.documentElement.lang =
            language;


        document.getElementById(
            "page-title"
        ).textContent =
            interfaceText[language].pageTitle;


        document.getElementById(
            "result-eyebrow"
        ).textContent =
            interfaceText[language].eyebrow;


        document.getElementById(
            "result-title"
        ).textContent =
            resultData.name;


        document.getElementById(
            "result-description"
        ).textContent =
            resultData.description;
        
        document.getElementById(
            "bakery-link-text"
        ).textContent =
            interfaceText[language].bakeryText;


        const bakeryLink =
            document.getElementById("bakery-link");

        bakeryLink.href =
            interfaceText[language].bakeryUrl;

        bakeryLink.textContent =
            interfaceText[language].bakeryUrl;


        /*
         * Restart quiz
         */

    </script>

</body>

</html>
